name: Repo Snapshot

on:
  push:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snapshot report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          {
            echo "# Repo Snapshot"
            echo
            echo "## Commit"
            echo "$(git rev-parse HEAD)"
            echo
            echo "## Tree (depth 4)"
            echo '```'
            # Check for tree utility, fallback to find
            if command -v tree >/dev/null 2>&1; then
              tree -a -L 4 -I ".git|.venv|__pycache__|.mypy_cache|.pytest_cache"
            else
              find . -maxdepth 4 -not -path '*/.*' | sed 's|^\./||'
            fi
            echo '```'
            echo
            echo "## Key files"
            for f in README.md pyproject.toml requirements.txt Dockerfile docker-compose.yml compose.yml; do
              if [ -f "$f" ]; then
                echo
                echo "### $f"
                echo '```'
                head -n 200 "$f" # Simpler than sed for first 200 lines
                echo '```'
              fi
            done
            echo
            echo "## Python package layout hints"
            echo '```'
            find . -maxdepth 4 -type f \( -name "*.py" -o -name "*.toml" -o -name "*.yaml" -o -name "*.yml" \) \
              | sed 's|^\./||' \
              | sort
            echo '```'
          } > output/snapshot.md

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot
          path: output/snapshot.md
          retention-days: 7
