[project]
name = "ai-news-feed"
version = "0.1.0"
description = ""
authors = [
    {name = "Adam Martin",email = "nonya@business.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "pydantic-ai (>=1.41.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "feedparser (>=6.0.12,<7.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "typer (>=0.21.1,<0.22.0)"
]

[tool.poetry]
packages = [{include = "ai_news_feed", from = "src"}]


[tool.poetry.scripts]
ai-news-feed = "ai_news_feed.cli:main"


[tool.poetry.group.dev.dependencies]
ruff = "^0.14.11"
black = "^25.12.0"
isort = "^7.0.0"
bandit = "^1.9.2"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
